name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  intranet-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.intranet.example .env
      - name: Validate independent intranet Docker Compose
        env:
          SYNAPSE_DB_PASSWORD: dummy-ci-db-password
          LATEX_COMPILER_TOKEN: dummy-ci-compile-token
        run: docker compose -f compose.intranet.yaml config --quiet
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile compiler/service.py
      - run: python -m unittest discover -s compiler -p 'test_*.py'
